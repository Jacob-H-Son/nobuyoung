<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>노부영 음원 QR 스티커 시트</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  @page{ size:A4; margin:12mm; }
  *{box-sizing:border-box}
  body{margin:0;background:#f4f1ec;color:#22201c;
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}

  /* ── 설정 패널 (인쇄 시 숨김) ── */
  .panel{max-width:820px;margin:0 auto;padding:28px 20px 8px}
  .panel h1{font-size:22px;margin:0 0 6px;letter-spacing:-.02em}
  .panel p{margin:0 0 16px;color:#6d6558;font-size:13.5px;line-height:1.6}
  .row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .row label{font-size:12.5px;font-weight:700;color:#6d6558;flex:0 0 100%}
  input[type=text]{flex:1;min-width:260px;padding:11px 13px;border:1px solid #ddd4c6;border-radius:10px;
    background:#fff;font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  input[type=text]:focus{outline:none;border-color:#e0603f}
  select,button{padding:11px 15px;border:1px solid #ddd4c6;border-radius:10px;background:#fff;
    font-size:14px;font-weight:650;cursor:pointer;color:#22201c}
  button.go{background:#e0603f;border-color:#e0603f;color:#fff}
  .hint{font-size:12px;color:#8d8474;line-height:1.6;background:#fff;border:1px solid #ebe3d6;
    border-radius:11px;padding:12px 14px;margin-top:6px}
  .hint b{color:#22201c}

  /* ── 시트 ── */
  .sheet{max-width:820px;margin:22px auto;background:#fff;padding:18px;
    border-radius:14px;box-shadow:0 8px 30px rgba(34,32,27,.08)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
  .cell{border:1px dashed #ccc3b4;padding:9px 6px 8px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:5px;break-inside:avoid}
  .cell .qr{width:100%;display:flex;justify-content:center}
  .cell canvas,.cell img{width:100%!important;height:auto!important;max-width:120px;image-rendering:pixelated}
  .no{font-size:10px;font-weight:800;letter-spacing:.08em;color:#e0603f}
  .ttl{font-size:10.5px;font-weight:700;line-height:1.3;letter-spacing:-.01em;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:26px}
  .brand{font-size:7.5px;color:#a89e8e;letter-spacing:.1em;text-transform:uppercase}

  @media print{
    body{background:#fff}
    .panel,.noprint{display:none!important}
    .sheet{box-shadow:none;margin:0;padding:0;max-width:none;border-radius:0}
    .cell{border-color:#e2e2e2}
  }
</style>
</head>
<body>

<div class="panel">
  <h1>QR 스티커 시트 만들기</h1>
  <p>마스터 페이지 주소를 넣고 <b>만들기</b>를 누른 다음, 브라우저에서 인쇄(Ctrl/⌘+P)하세요.<br>
     점선을 따라 잘라 각 책 표지에 붙이면 됩니다.</p>

  <div class="row">
    <label>마스터 페이지 주소</label>
    <input type="text" id="base" placeholder="https://example.com/nobuyoung.html" spellcheck="false">
    <select id="cols">
      <option value="4">한 줄에 4개</option>
      <option value="3">한 줄에 3개 (크게)</option>
      <option value="5">한 줄에 5개 (작게)</option>
    </select>
    <button class="go" id="go">만들기</button>
    <button id="prt">인쇄</button>
  </div>

  <div class="hint">
    <b>QR 1장 = 책 1권입니다.</b> 찍으면 그 책의 트랙 목록(스토리송 · 리딩 · 챈트 · 멜로디)이 열립니다.<br>
    링크는 파일 ID가 아니라 <b>앨범 고유 주소</b>로 걸려 있어서, 음원을 다시 올려도
    <b>인쇄한 QR이 계속 살아있습니다.</b> 단, 드라이브의 <b>폴더 이름은 바꾸지 마세요.</b>
  </div>
</div>

<div class="sheet"><div class="grid" id="grid"></div></div>

<script>
/* 책 목록 — 새 책이 늘면 여기에 한 줄씩 추가하세요 */
const BOOKS = [
  {sl:"story-song", t:"Story Song", c:11},
  {sl:"choo-choo", t:"Choo Choo", c:6},
  {sl:"lemons-are-not-red", t:"Lemons Are Not Red", c:7},
  {sl:"nighty-night-little-green-monster", t:"Nighty Night, Little Green Monster", c:7},
  {sl:"splish-splash-ducky", t:"Splish Splash Ducky", c:7},
  {sl:"whose-baby-am-i", t:"Whose Baby Am I", c:11},
  {sl:"welcome-baby", t:"Welcome Baby", c:35},
];

const $ = s => document.querySelector(s);

function draw(){
  let base = $('#base').value.trim();
  if(!base){ alert('마스터 페이지 주소를 먼저 입력해 주세요.'); $('#base').focus(); return; }
  base = base.split('#')[0];
  const cols = $('#cols').value;
  const size = cols==='3' ? 300 : cols==='5' ? 200 : 250;
  const grid = $('#grid');
  grid.style.gridTemplateColumns = `repeat(${cols},1fr)`;
  grid.innerHTML = '';

  BOOKS.forEach(b=>{
    const cell = document.createElement('div');
    cell.className = 'cell';
    const holder = document.createElement('div');
    holder.className = 'qr';
    cell.appendChild(holder);

    const cap = document.createElement('div');
    cap.innerHTML = `<div class="no">${b.c}곡</div>
                     <div class="ttl">${b.t}</div>
                     <div class="brand">노부영 음원</div>`;
    cell.appendChild(cap);
    grid.appendChild(cell);

    new QRCode(holder, {
      text: `${base}#${b.sl}`,
      width: size, height: size,
      colorDark:"#1a1815", colorLight:"#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
  });
  window.scrollTo({top: $('.sheet').offsetTop - 20, behavior:'smooth'});
}

$('#go').onclick = draw;
$('#prt').onclick = ()=>{ if(!$('#grid').children.length) return draw(); window.print(); };
$('#base').addEventListener('keydown', e=>{ if(e.key==='Enter') draw(); });

/* 웹에 올라가 있으면 마스터 페이지 주소를 자동으로 채우고 바로 생성 */
(function autofill(){
  if(location.protocol === 'file:') return;
  $('#base').value = location.href.split(/[#?]/)[0].replace(/qr\.html$/, '');
  draw();
})();
</script>
</body>
</html>
