<style>

  @media (prefers-color-scheme:dark){

          --line:#332e38;--accent:#ff7f5e;--soft:#2d2027;--ok:#5cbb90;
          --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    padding-bottom:calc(120px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px}

  header{padding:24px 0 4px}
  .eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:700}
  h1{font-size:26px;line-height:1.22;margin:7px 0 3px;letter-spacing:-.025em;font-weight:780}
  .sub{color:var(--ink2);font-size:13.5px}
  .status{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;
    color:var(--ink2);background:var(--card);border:1px solid var(--line);
    padding:5px 11px;border-radius:999px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ink3)}
  .dot.live{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}

  .search{position:relative;margin:16px 0 10px}
  .search input{width:100%;padding:13px 40px 13px 42px;border-radius:13px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);font-size:16px;outline:none;box-shadow:var(--shadow)}
  .search input:focus{border-color:var(--accent)}
  .search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.4}
  .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;
    color:var(--ink2);font-size:19px;padding:8px;cursor:pointer;display:none}

  .tabs{display:flex;gap:7px;overflow-x:auto;padding:4px 16px 14px;margin:0 -16px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink2);
    padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:650;cursor:pointer;white-space:nowrap;transition:.14s}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

  .grp{margin:0 0 18px}
  .grp-h{display:flex;align-items:baseline;justify-content:space-between;margin:2px 3px 9px;gap:10px}
  .grp-h h2{font-size:16px;margin:0;font-weight:720;letter-spacing:-.015em;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grp-h .n{font-size:12px;color:var(--ink3);flex:0 0 auto}
  ul.list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);
    border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
  li.trk{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer;border-top:1px solid var(--line)}
  li.trk:first-child{border-top:0}
  li.trk:active{background:var(--soft)}
  li.trk.on{background:var(--soft)}
  .num{flex:0 0 33px;height:33px;border-radius:10px;background:var(--bg);border:1px solid var(--line);
    display:grid;place-items:center;font-size:12.5px;font-weight:750;color:var(--ink2)}
  li.trk.on .num{background:var(--accent);border-color:var(--accent);color:#fff}
  .meta{min-width:0;flex:1}
  .t1{font-size:15px;font-weight:640;letter-spacing:-.012em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .t2{font-size:12px;color:var(--ink3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .eq{flex:0 0 auto;display:none;gap:2.5px;align-items:flex-end;height:14px}
  li.trk.on .eq{display:flex}
  .eq i{width:3px;background:var(--accent);border-radius:2px;animation:eq .9s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}
  @keyframes eq{0%,100%{height:4px}50%{height:14px}}
  .empty{padding:40px 20px;text-align:center;color:var(--ink3);font-size:14px}

  .player{position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:color-mix(in srgb,var(--card) 93%,transparent);
    backdrop-filter:saturate(1.7) blur(20px);-webkit-backdrop-filter:saturate(1.7) blur(20px);
    border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom));
    transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
  .player.up{transform:none}
  .player .in{max-width:760px;margin:0 auto}
  .ptop{display:flex;align-items:center;gap:10px}
  .pm{flex:1;min-width:0}
  .pt{font-size:14.5px;font-weight:720;letter-spacing:-.012em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ps{font-size:11.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .b{border:0;background:none;color:var(--ink);cursor:pointer;padding:8px;display:grid;place-items:center;border-radius:11px}
  .b:active{background:var(--soft)}
  .b.play{background:var(--accent);color:#fff;width:47px;height:47px;border-radius:50%;flex:0 0 auto}
  .bar{display:flex;align-items:center;gap:9px;margin-top:8px}
  .tm{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:0 0 38px}
  .tm.r{text-align:right}
  input[type=range]{flex:1;-webkit-appearance:none;appearance:none;background:transparent;height:22px;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:3px;
    background:linear-gradient(var(--accent),var(--accent)) 0/var(--pct,0%) 100% no-repeat,var(--line)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:var(--accent);margin-top:-5.5px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  input[type=range]::-moz-range-track{height:4px;border-radius:3px;background:var(--line)}
  input[type=range]::-moz-range-progress{height:4px;border-radius:3px;background:var(--accent)}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:var(--accent)}
  .chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .chip{font-size:11.5px;font-weight:650;color:var(--ink2);border:1px solid var(--line);background:var(--card);
    border-radius:999px;padding:5px 11px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

  .modal{position:fixed;inset:0;z-index:60;background:rgba(20,17,14,.74);display:none;place-items:center;padding:20px}
  .modal.on{display:grid}
  .box{background:var(--card);border-radius:16px;width:100%;max-width:460px;padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
  .box h3{margin:0 0 5px;font-size:16px}
  .box p{margin:0 0 13px;font-size:13px;color:var(--ink2);line-height:1.55}

  .box button{margin-top:12px;width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);

  footer{text-align:center;color:var(--ink3);font-size:11.5px;padding:22px 0 8px;line-height:1.7}

    {n:"27", t:"1 2 3", id:"1fAUcZavq7gnxehpyh7hvPf6BTrscAcg1"},

/* ─── 유틸 ─── */
const $=s=>document.querySelector(s);
const au=$('#au');
const mem={}; const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
};
const fmt=s=>(!isFinite(s)||s<0)?"0:00":Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,'0');
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
const gs=g=>g.sl||slug(g.g);   // 앨범 고유 주소(QR 링크의 기준)

/* 파일명 → 보기 좋은 제목 (01_Color_Zoo.mp3 → 01 / Color Zoo) */
const FIX={ "felen":"Helen", "nightly":"Nighty", "noisly":"Noisy", "jybooks":"JY Books" };
function parseName(raw){
  let s = raw.replace(/\.(mp3|m4a|wav|aac|ogg)$/i,'');
  let n = ''; const m = s.match(/^(\d{1,3})[\s._-]+(.*)$/);
  if(m){ n = m[1].padStart(2,'0'); s = m[2]; }
  s = s.replace(/[_]+/g,' ').replace(/\s+/g,' ').trim();
  s = s.split(' ').map(w=>{
    const k = w.toLowerCase().replace(/[^a-z]/g,'');
    if(FIX[k]) return w.replace(new RegExp(k,'i'), FIX[k]);
    return w;
  }).join(' ');
  s = s.replace(/\bnot\b/g,'Not').replace(/\btoo\b/g,'Too').replace(/\bare\b/g,'Are');
  return {n, t:s};
}
const prettyGroup = s => s.replace(/[_]+/g,' ').replace(/\s+/g,' ').trim();

/* ─── 상태 ─── */
let DATA=[], flat=[], view=[], curTab='all', cur=null, ci=-1;
let autoNext=true, repOne=false, spd=1, sleepT=null, tried=0;
const SPDS=[1,.85,.75,1.25];

const urlMedia = id => APIKEY
  ? `https://www.googleapis.com/drive/v3/files/${id}?alt=media&key=${APIKEY}`
  : `https://drive.google.com/uc?export=download&id=${id}`;
const urlAlt     = id => `https://drive.usercontent.google.com/download?id=${id}&export=download`;
const urlPreview = id => `https://drive.google.com/file/d/${id}/preview`;

/* ─── 드라이브 실시간 로딩 ─── */
async function gList(parent){
  let out=[], token='';
  do{
    const u = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(`'${parent}' in parents and trashed=false`)}`
            + `&key=${APIKEY}&fields=nextPageToken,files(id,name,mimeType)&pageSize=1000&orderBy=name`
            + (token ? `&pageToken=${token}` : '');
    const r = await fetch(u);
    if(!r.ok){
      let msg=''; try{ msg=(await r.json()).error?.message||''; }catch(e){}
      const err=new Error(msg||('HTTP '+r.status)); err.code=r.status; err.detail=msg; throw err;
    }
    const j = await r.json();
    out = out.concat(j.files||[]);
    token = j.nextPageToken || '';
  } while(token);          // 페이지가 여러 장이어도 전부 가져옴 (누락 방지)
  return out;
}
/* 오류를 사람이 읽을 수 있는 말로 */
function explain(e){
  const d=(e.detail||e.message||'').toLowerCase();
  if(d.includes('referer')||d.includes('referrer'))
    return '이 주소가 API 키에 등록되어 있지 않습니다 (웹사이트 제한 확인)';
  if(d.includes('has not been used')||d.includes('disabled'))
    return 'Google Drive API가 켜져 있지 않습니다';
  if(d.includes('api key not valid')||d.includes('expired'))
    return 'API 키가 올바르지 않습니다';
  if(e.code===404) return '폴더를 찾을 수 없습니다 (공유 설정 확인)';
  return e.detail || e.message || '알 수 없는 오류';
}
async function loadLive(){
  const top = await gList(ROOT);
  const folders = top.filter(f=>f.mimeType.includes('folder'));
  const loose   = top.filter(f=>f.mimeType.startsWith('audio/'));
  const groups  = [];
  if(loose.length) groups.push({g:"기타", items:loose.map(f=>({...parseName(f.name), id:f.id}))});
  const kids = await Promise.all(folders.map(f=>gList(f.id).catch(()=>[])));
  folders.forEach((f,i)=>{
    const its = kids[i].filter(x=>x.mimeType.startsWith('audio/'))
                       .map(x=>({...parseName(x.name), id:x.id}));
    if(its.length) groups.push({g:prettyGroup(f.name), items:its});
  });
  groups.forEach(g=>g.items.sort((a,b)=>(a.n||'zz').localeCompare(b.n||'zz')));
  return groups;
}

/* ─── 렌더 ─── */
function build(){
  flat = [];
  DATA.forEach(g=>g.items.forEach(it=>flat.push({...it, g:g.g, gid:gs(g)})));
  renderTabs(); render();
  $('#foot').innerHTML = `총 ${DATA.length}개 묶음 · ${flat.length}개 음원<br>`
    + `<a href="qr.html" style="color:inherit;text-decoration:underline">QR 스티커 시트 인쇄 →</a>`;
}
function renderTabs(){
  $('#tabs').innerHTML = `<button class="tab" data-t="all" aria-selected="${curTab==='all'}">전체</button>`
    + DATA.map(g=>`<button class="tab" data-t="${gs(g)}" aria-selected="${curTab===gs(g)}">${g.g}</button>`).join('');
}
function render(){
  const q = $('#q').value.trim().toLowerCase();
  $('#clr').style.display = q?'block':'none';
  view = flat.filter(x=>{
    const okT = curTab==='all' || x.gid===curTab;
    const okQ = !q || (x.n+' '+x.t+' '+x.g).toLowerCase().includes(q);
    return (q ? okQ : okT && okQ);
  });
  if(!view.length){ $('#body').innerHTML = '<div class="empty">일치하는 음원이 없어요</div>'; return; }
  const groups = [];
  view.forEach(x=>{ let g=groups.find(y=>y.g===x.g); if(!g){g={g:x.g,gid:x.gid,items:[]};groups.push(g);} g.items.push(x); });
  $('#body').innerHTML = groups.map(g=>`
    <section class="grp" id="${g.gid}">
      <div class="grp-h"><h2>${g.g}</h2><span class="n">${g.items.length}곡</span></div>
      <ul class="list">${g.items.map(it=>`
        <li class="trk" data-i="${view.indexOf(it)}">
          <div class="num">${it.n||'♪'}</div>
          <div class="meta"><div class="t1">${it.t}</div><div class="t2">${g.g}</div></div>
          <div class="eq"><i></i><i></i><i></i></div>
        </li>`).join('')}</ul>
    </section>`).join('');
  mark();
}
function mark(){
  document.querySelectorAll('li.trk').forEach(li=>li.classList.remove('on'));
  if(!cur) return;
  const i = view.findIndex(x=>x.id===cur.id);
  if(i>=0){ const li=document.querySelector(`li.trk[data-i="${i}"]`); if(li) li.classList.add('on'); }
}

/* ─── 재생 ─── */
function play(i){
  if(i<0||i>=view.length) return;
  ci=i; cur=view[i]; tried=0;
  $('#pt').textContent=cur.t; $('#ps').textContent=cur.g+(cur.n?' · '+cur.n:'');
  $('#player').classList.add('up');
  au.src=srcChain(cur.id)[0]; au.load(); au.playbackRate=spd; au.play().catch(()=>{});
  lastT=0; stuck=0;
  store.set('last', cur.id); mark();
  setTimeout(preloadNext, 2500);          // 다음 곡 미리 준비
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title:cur.t,artist:cur.g,album:'노부영 음원'});
    navigator.mediaSession.setActionHandler('previoustrack',()=>play(ci-1));
    navigator.mediaSession.setActionHandler('nexttrack',()=>play(ci+1));
    navigator.mediaSession.setActionHandler('play',()=>au.play().catch(()=>{}));
    navigator.mediaSession.setActionHandler('pause',()=>au.pause());
  }
}
/* 재생 주소 후보 — 앞의 것이 실패하면 다음 것으로 자동 전환 */
function srcChain(id){
  const c=[];
  if(APIKEY) c.push(`https://www.googleapis.com/drive/v3/files/${id}?alt=media&key=${APIKEY}`);
  c.push(`https://drive.google.com/uc?export=download&id=${id}`);
  c.push(`https://drive.usercontent.google.com/download?id=${id}&export=download`);
  return c;
}
au.addEventListener('error',()=>{
  if(!cur) return;
  const chain=srcChain(cur.id); tried++;
  if(tried < chain.length){ au.src=chain[tried]; au.load(); au.play().catch(()=>{}); }
  else fallback();
});
function fallback(){
  $('#mT').textContent=cur.t;
  $('#mP').textContent='브라우저에서 바로 재생되지 않아 구글 드라이브 플레이어로 엽니다. 폴더 공유가 "링크가 있는 모든 사용자"로 되어 있는지 확인해 주세요.';
  $('#mF').style.display='block'; $('#mF').src=urlPreview(cur.id);
  $('#modal').classList.add('on');
}
function notice(t,p){ $('#mT').textContent=t; $('#mP').textContent=p; $('#mF').style.display='none'; $('#modal').classList.add('on'); }
$('#mX').onclick=()=>{ $('#mF').src=''; $('#modal').classList.remove('on'); };
$('#modal').onclick=e=>{ if(e.target.id==='modal') $('#mX').click(); };

$('#play').onclick=()=>{ if(!cur){play(0);return;} au.paused?au.play():au.pause(); };
$('#prev').onclick=()=>{ au.currentTime>3 ? au.currentTime=0 : play(ci-1); };
$('#next').onclick=()=>play(ci+1);
au.onplay =()=>{$('#ip').style.display='none';$('#iq').style.display='block'};
au.onpause=()=>{$('#ip').style.display='block';$('#iq').style.display='none'};
/* ═══ 자동 다음곡 — 3중 안전장치 ═══════════════════════════════
   드라이브 기본 주소는 곡이 끝나도 ended 신호를 안 보낼 때가 있어서,
   ① ended 이벤트 ② 재생위치가 끝에 도달 ③ 재생이 멈춰버림(워치독)
   — 셋 중 무엇이든 걸리면 다음 곡으로 넘어갑니다.            */
let advLock=false, lastT=0, stuck=0;
function goNext(why){
  if(advLock) return; advLock=true;
  setTimeout(()=>advLock=false, 1200);
  if(repOne){ au.currentTime=0; au.play().catch(()=>{}); return; }
  if(autoNext && ci+1 < view.length) play(ci+1);
  else if(autoNext){ au.pause(); }   // 마지막 곡이면 정지
}
au.onended = ()=>goNext('ended');

au.ontimeupdate=()=>{
  const d=au.duration;
  if(isFinite(d) && d>0){
    const p=au.currentTime/d*100;
    $('#seek').value=p*10; $('#seek').style.setProperty('--pct',p+'%');
    $('#dur').textContent=fmt(d);
    if(au.currentTime >= d-0.35) goNext('near-end');   // ②
  } else {
    $('#dur').textContent='--:--';
  }
  $('#cur').textContent=fmt(au.currentTime);
};

/* ③ 워치독 — 재생 중인데 시간이 멈췄고, 버퍼링 중도 아니면 끝난 것으로 간주.
      로딩이 느려서 멈춘 경우(buffering)에는 절대 넘기지 않습니다. */
let buffering=false;
au.addEventListener('waiting', ()=>buffering=true);
au.addEventListener('playing', ()=>{buffering=false; stuck=0;});
au.addEventListener('stalled', ()=>buffering=true);
setInterval(()=>{
  if(au.paused || !cur || au.seeking || buffering || au.networkState===2){
    stuck=0; lastT=au.currentTime; return;
  }
  if(Math.abs(au.currentTime-lastT) < 0.05){
    stuck++;
    if(stuck>=5 && au.currentTime>1){ stuck=0; goNext('watchdog'); }
  } else stuck=0;
  lastT=au.currentTime;
}, 1000);

/* 다음 곡 미리 받아두기 — 넘어갈 때 끊김 최소화 */
const pre=new Audio(); pre.preload='auto';
function preloadNext(){
  const n=view[ci+1]; if(!n) return;
  try{ pre.src=urlMedia(n.id); pre.load(); }catch(e){}
}
$('#seek').oninput=e=>{ if(au.duration) au.currentTime=au.duration*e.target.value/1000; };

$('#cRep').onclick =e=>{repOne=!repOne;e.currentTarget.setAttribute('aria-pressed',repOne)};
$('#cAuto').onclick=e=>{autoNext=!autoNext;e.currentTarget.setAttribute('aria-pressed',autoNext)};
$('#cSpd').onclick =e=>{spd=SPDS[(SPDS.indexOf(spd)+1)%SPDS.length];au.playbackRate=spd;
  e.currentTarget.textContent=(spd===1?'1':spd)+'×'};
$('#cSleep').onclick=e=>{
  if(sleepT){clearTimeout(sleepT);sleepT=null;e.currentTarget.setAttribute('aria-pressed',false);}
  else{ sleepT=setTimeout(()=>{au.pause();sleepT=null;$('#cSleep').setAttribute('aria-pressed',false);},30*60*1000);
        e.currentTarget.setAttribute('aria-pressed',true); }
};

document.addEventListener('click',e=>{
  const t=e.target.closest('.tab');
  if(t){ curTab=t.dataset.t; $('#q').value=''; if(curTab!=='all')location.hash=curTab; renderTabs(); render(); return; }
  const li=e.target.closest('li.trk'); if(li) play(+li.dataset.i);
});
$('#q').addEventListener('input',render);
$('#clr').onclick=()=>{$('#q').value='';render()};
window.addEventListener('hashchange',applyHash);
function applyHash(){
  const h=decodeURIComponent(location.hash.slice(1)); if(!h) return;

  // ① 트랙 딥링크 — #t=<파일ID>  또는  #n=03 (트랙번호)
  if(h.startsWith('t=')||h.startsWith('n=')){
    const v=h.slice(2);
    const item = h[0]==='t' ? flat.find(x=>x.id===v)
                            : flat.find(x=>x.n===v.padStart(2,'0'));
    if(item){
      curTab='all'; $('#q').value=''; renderTabs(); render();
      const i=view.findIndex(x=>x.id===item.id);
      if(i>=0){
        play(i);
        setTimeout(()=>{
          const li=document.querySelector(`li.trk[data-i="${i}"]`);
          if(li) li.scrollIntoView({behavior:'smooth',block:'center'});
        },60);
        // 브라우저가 자동재생을 막았을 때: 한 번만 탭하면 시작
        setTimeout(()=>{ if(au.paused){
          const once=()=>{ au.play().catch(()=>{}); document.removeEventListener('touchend',once);
                           document.removeEventListener('click',once); };
          document.addEventListener('touchend',once,{once:true});
          document.addEventListener('click',once,{once:true});
        }},350);
      }
    }
    return;
  }

  // ② 묶음(책) 딥링크 — #story-song
  if(DATA.some(g=>gs(g)===h)){ curTab=h; renderTabs(); render();
    const el=document.getElementById(h); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }
}

/* ─── 부팅 ─── */
(async function(){
  if(APIKEY){
    try{
      const live = await loadLive();
      const n = live.reduce((a,g)=>a+g.items.length,0);
      if(!n) throw new Error('폴더에 음원이 없습니다');
      DATA = live;
      $('#dot').className='dot live';
      $('#statusTxt').textContent=`드라이브와 자동 동기화됨 · ${n}곡`;
    }catch(e){
      DATA = SEED;                       // 실패해도 페이지는 정상 동작
      const why = explain(e);
      $('#statusTxt').textContent='저장된 목록으로 표시 중';
      $('#statusTxt').parentElement.title = '자동 동기화 실패: ' + why;
      $('#statusTxt').parentElement.style.cursor='help';
      $('#statusTxt').parentElement.onclick=()=>notice('자동 동기화가 안 되고 있어요', why
        + '\n\n지금 보시는 목록은 저장된 예비 목록이라 재생에는 문제가 없습니다.');
      console.warn('[sync]', why, e);
    }
  } else {
    DATA = SEED;
    $('#statusTxt').textContent='저장된 목록 (자동 동기화 꺼짐)';
  }
  build(); applyHash();
})();
</script>
